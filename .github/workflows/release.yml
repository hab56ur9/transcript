name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: rp
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build-upload:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: macos-15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - run: swift test

      - run: swift build -c release

      - run: |
          source bin/bundle-lib.sh
          mkdir -p .build/dist
          assemble_app "$PWD/.build/dist/Transcript.app" "com.nathan.transcript" "Transcript" "$PWD"
          ditto -ck --keepParent .build/dist/Transcript.app .build/dist/Transcript.app.zip

      - run: gh release upload "${{ needs.release-please.outputs.tag_name }}" --repo "$GITHUB_REPOSITORY" .build/dist/Transcript.app.zip
